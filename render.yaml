databases:
  - name: veridom-bids-db
    plan: free
    databaseName: veridom_bids
    user: veridom

services:
  - type: web
    name: veridom-bids
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && NITRO_PRESET=node pnpm build
    startCommand: pnpm migrate:production && node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: veridom-bids-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://veridom-bids.onrender.com
      # Any OpenAI-compatible endpoint works. The demo uses NEAR AI Cloud.
      - key: OPENAI_BASE_URL
        value: https://cloud-api.near.ai/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_ENGINE
        value: ai-sdk:openai
      - key: AGENT_MODEL
        value: anthropic/claude-haiku-5-5
